services:
  - type: web
    name: kolekcionerski-svyat
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__CollectionDb
        fromDatabase:
          name: collection-manager-db
          property: connectionString
      - key: Jwt__SigningKey
        generateValue: true

databases:
  - name: collection-manager-db
    databaseName: collection_manager
    user: collection_manager
    plan: free
    region: frankfurt
